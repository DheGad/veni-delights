<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="creamGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5AE61" />
      <stop offset="50%" stop-color="#9C7323" />
      <stop offset="100%" stop-color="#735214" />
    </linearGradient>
    <linearGradient id="strawberryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A92D42" />
      <stop offset="100%" stop-color="#7A1829" />
    </linearGradient>
  </defs>

  <!-- Cream Background -->
  <circle cx="250" cy="250" r="236" fill="#F8EDE5" stroke="#A92D42" stroke-width="4" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#creamGold)" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="250" cy="250" r="206" fill="#FFF8F4" stroke="#452A27" stroke-width="1.2" />

  <!-- Botanical Wreath -->
  <g fill="none" stroke="url(#creamGold)" stroke-width="2" opacity="0.85">
    <path d="M 120,250 C 120,180 160,130 220,105 C 195,140 185,190 190,250 C 185,310 195,360 220,395 C 160,370 120,320 120,250 Z" fill="#E7B9B5" fill-opacity="0.3" />
    <path d="M 380,250 C 380,180 340,130 280,105 C 305,140 315,190 310,250 C 315,310 305,360 280,395 C 340,370 380,320 380,250 Z" fill="#E7B9B5" fill-opacity="0.3" />
  </g>

  <!-- Crown -->
  <g transform="translate(250, 145) scale(0.95)" fill="url(#creamGold)">
    <path d="M -45,-5 L -35,20 L 35,20 L 45,-5 L 22,8 L 0,-15 L -22,8 Z" />
    <circle cx="-45" cy="-8" r="4" />
    <circle cx="-22" cy="5" r="3" />
    <circle cx="0" cy="-18" r="5" />
    <circle cx="22" cy="5" r="3" />
    <circle cx="45" cy="-8" r="4" />
    <path d="M 0,-6 C -4,-6 -6,-3 -6,0 C -6,4 0,8 0,8 C 0,8 6,4 6,0 C 6,-3 4,-6 0,-6 Z" fill="#A92D42" />
  </g>

  <!-- Monogram VD -->
  <g id="monogram" transform="translate(250, 245)">
    <text x="-26" y="24" font-family="'Cormorant Garamond', serif" font-size="82" font-weight="700" fill="#452A27" text-anchor="middle" letter-spacing="2">V</text>
    <text x="24" y="24" font-family="'Cormorant Garamond', serif" font-size="82" font-weight="700" fill="#A92D42" text-anchor="middle" letter-spacing="2">D</text>
    <path d="M -70,38 Q 0,46 70,38" fill="none" stroke="url(#creamGold)" stroke-width="2.5" />
    <circle cx="0" cy="42" r="3.5" fill="#A92D42" />
  </g>

  <!-- Arcs -->
  <path id="upperArc" d="M 90,250 A 160,160 0 0,1 410,250" fill="none" stroke="none" />
  <text font-family="'Cormorant Garamond', serif" font-size="28" font-weight="700" letter-spacing="9" fill="#A92D42">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      VENI DELIGHTS
    </textPath>
  </text>

  <path id="lowerArc" d="M 410,250 A 160,160 0 0,1 90,250" fill="none" stroke="none" />
  <text font-family="'Poppins', sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#452A27">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
      HOMEMADE BAKERY • EST. 2020
    </textPath>
  </text>
</svg>
