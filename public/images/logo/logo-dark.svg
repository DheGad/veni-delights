    <path d="M 0,-6 C -4,-6 -6,-3 -6,0 C -6,4 0,8 0,8 C 0,8 6,4 6,0 C 6,-3 4,-6 0,-6 Z" fill="#D5AE61" />
  </g>

  <g id="monogram" transform="translate(250, 245)">
