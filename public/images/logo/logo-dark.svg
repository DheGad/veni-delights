      <stop offset="50%" stop-color="#D5AE61" />
      <stop offset="100%" stop-color="#9C7323" />
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="236" fill="#0A0606" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#D5AE61" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
  <circle cx="250" cy="250" r="206" fill="#140C0B" stroke="#D5AE61" stroke-width="1" />

  <g transform="translate(250, 145) scale(0.95)" fill="url(#goldGrad)">
