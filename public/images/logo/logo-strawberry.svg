<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="strawberryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C23B52" />
      <stop offset="50%" stop-color="#A92D42" />
      <stop offset="100%" stop-color="#7A1829" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFAB" />
      <stop offset="45%" stop-color="#D5AE61" />
      <stop offset="70%" stop-color="#EED596" />
      <stop offset="100%" stop-color="#A77E2A" />
    </linearGradient>
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="250" cy="250" r="236" fill="#140C0B" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#A92D42" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" />
  <circle cx="250" cy="250" r="206" fill="#1D1211" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Botanical Wreath / Flourish -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9">
    <!-- Left Leaf Arc -->
    <path d="M 120,250 C 120,180 160,130 220,105 C 195,140 185,190 190,250 C 185,310 195,360 220,395 C 160,370 120,320 120,250 Z" fill="url(#strawberryGrad)" fill-opacity="0.2" />
    <!-- Right Leaf Arc -->
    <path d="M 380,250 C 380,180 340,130 280,105 C 305,140 315,190 310,250 C 315,310 305,360 280,395 C 340,370 380,320 380,250 Z" fill="url(#strawberryGrad)" fill-opacity="0.2" />
  </g>

  <!-- Crown Emblem at Top -->
  <g transform="translate(250, 145) scale(0.95)" fill="url(#goldGrad)">
    <path d="M -45,-5 L -35,20 L 35,20 L 45,-5 L 22,8 L 0,-15 L -22,8 Z" />
    <circle cx="-45" cy="-8" r="4" />
    <circle cx="-22" cy="5" r="3" />
    <circle cx="0" cy="-18" r="5" />
    <circle cx="22" cy="5" r="3" />
    <circle cx="45" cy="-8" r="4" />
    <!-- Mini Strawberry Gem in Crown -->
    <path d="M 0,-6 C -4,-6 -6,-3 -6,0 C -6,4 0,8 0,8 C 0,8 6,4 6,0 C 6,-3 4,-6 0,-6 Z" fill="#A92D42" />
  </g>

  <!-- Central Monogram "VD" -->
  <g id="monogram" transform="translate(250, 245)">
    <!-- V -->
    <text x="-26" y="24" font-family="'Cormorant Garamond', serif" font-size="82" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">V</text>
    <!-- D -->
    <text x="24" y="24" font-family="'Cormorant Garamond', serif" font-size="82" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">D</text>
    <!-- Flourish divider -->
    <path d="M -70,38 Q 0,46 70,38" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="0" cy="42" r="3.5" fill="#A92D42" />
  </g>

  <!-- Upper Arc: VENI DELIGHTS -->
  <path id="upperArc" d="M 90,250 A 160,160 0 0,1 410,250" fill="none" stroke="none" />
  <text font-family="'Cormorant Garamond', serif" font-size="28" font-weight="600" letter-spacing="9" fill="url(#goldGrad)">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      VENI DELIGHTS
    </textPath>
  </text>

  <!-- Lower Arc: STRAWBERRY LUXURY PATISSERIE -->
  <path id="lowerArc" d="M 410,250 A 160,160 0 0,1 90,250" fill="none" stroke="none" />
  <text font-family="'Poppins', sans-serif" font-size="14" font-weight="500" letter-spacing="6" fill="#F8EDE5" opacity="0.95">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
      HOMEMADE BAKERY • EST. 2020
    </textPath>
  </text>
</svg>
