<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2A1416" />
      <stop offset="45%" stop-color="#180C0D" />
      <stop offset="100%" stop-color="#0A0506" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D1" />
      <stop offset="35%" stop-color="#D5AE61" />
      <stop offset="70%" stop-color="#F2DFAB" />
      <stop offset="100%" stop-color="#9C7323" />
    </linearGradient>
    <linearGradient id="strawberryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E24A64" />
      <stop offset="50%" stop-color="#A92D42" />
      <stop offset="100%" stop-color="#701524" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1080" fill="url(#bgGlow)" />
  <circle cx="540" cy="540" r="490" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" />
  <circle cx="540" cy="540" r="460" fill="none" stroke="#A92D42" stroke-width="3" stroke-dasharray="14,10" opacity="0.75" />

  <!-- Outer Ambient Gold Halo -->
  <circle cx="540" cy="540" r="390" fill="#140C0B" stroke="url(#goldGrad)" stroke-width="4" filter="url(#softGlow)" opacity="0.3" />
  <circle cx="540" cy="540" r="390" fill="#140C0B" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Flourish Wreath -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8">
    <path d="M 280,540 C 280,400 360,300 480,250 C 430,320 410,420 420,540 C 410,660 430,760 480,830 C 360,780 280,680 280,540 Z" fill="url(#strawberryGrad)" fill-opacity="0.25" />
    <path d="M 800,540 C 800,400 720,300 600,250 C 650,320 670,420 660,540 C 670,660 650,760 600,830 C 720,780 800,680 800,540 Z" fill="url(#strawberryGrad)" fill-opacity="0.25" />
  </g>

  <!-- Crown -->
  <g transform="translate(540, 310) scale(1.8)" fill="url(#goldGrad)">
    <path d="M -45,-5 L -35,20 L 35,20 L 45,-5 L 22,8 L 0,-15 L -22,8 Z" />
    <circle cx="-45" cy="-8" r="4" />
    <circle cx="-22" cy="5" r="3" />
    <circle cx="0" cy="-18" r="5" />
    <circle cx="22" cy="5" r="3" />
    <circle cx="45" cy="-8" r="4" />
    <path d="M 0,-6 C -4,-6 -6,-3 -6,0 C -6,4 0,8 0,8 C 0,8 6,4 6,0 C 6,-3 4,-6 0,-6 Z" fill="#A92D42" />
  </g>

  <!-- Central Monogram VD -->
  <g transform="translate(540, 520)">
    <text x="-56" y="56" font-family="'Cormorant Garamond', Georgia, serif" font-size="170" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">V</text>
    <text x="56" y="56" font-family="'Cormorant Garamond', Georgia, serif" font-size="170" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">D</text>
    <path d="M -150,88 Q 0,105 150,88" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
    <circle cx="0" cy="98" r="7" fill="#A92D42" />
  </g>

  <!-- Top Title -->
  <path id="socialUpperArc" d="M 200,540 A 340,340 0 0,1 880,540" fill="none" stroke="none" />
  <text font-family="'Cormorant Garamond', Georgia, serif" font-size="54" font-weight="700" letter-spacing="18" fill="url(#goldGrad)">
    <textPath href="#socialUpperArc" startOffset="50%" text-anchor="middle">
      VENI DELIGHTS
    </textPath>
  </text>

  <!-- Bottom Subtitle -->
  <path id="socialLowerArc" d="M 880,540 A 340,340 0 0,1 200,540" fill="none" stroke="none" />
  <text font-family="'Poppins', sans-serif" font-size="28" font-weight="500" letter-spacing="12" fill="#F8EDE5" opacity="0.95">
    <textPath href="#socialLowerArc" startOffset="50%" text-anchor="middle">
      STRAWBERRY LUXURY PATISSERIE
    </textPath>
  </text>
</svg>
